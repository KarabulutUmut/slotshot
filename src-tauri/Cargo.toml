[package]
name = "slotshot"
version = "0.1.0"
description = "A lightweight screenshot utility for macOS and Windows"
authors = ["Slotshot contributors"]
license = "MIT"
repository = "https://github.com/KarabulutUmut/slotshot"
edition = "2024"

[lib]
# Keep the library name distinct from the binary on Windows.
name = "slotshot_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tokio = { version = "1", default-features = false, features = ["time"] }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.9.8"
serde_json = "1"
tempfile = "3"
rfd = { version = "0.17.2", default-features = false }
drag = "2.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
